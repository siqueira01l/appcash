<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar Transação - FinanceDash</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <h1>FinanceDash</h1>

    <h2>Editar transação</h2>

    <form method="POST">

        <label for="descricao">Descrição:</label>
        <input type="text" id="descricao" name="descricao" value="{{ transacao.descricao }}" required>

        <br><br>

        <label for="valor">Valor:</label>
        <input type="number" id="valor" name="valor" step="0.01" value="{{ transacao.valor }}" required>

        <br><br>

        <label for="tipo">Tipo:</label>

        <select id="tipo" name="tipo" required>

            <option value="receita"
                {% if transacao.tipo == "receita" %}selected{% endif %}>
                Receita
            </option>

            <option value="despesa"
                {% if transacao.tipo == "despesa" %}selected{% endif %}>
                Despesa
            </option>

        </select>

        <br><br>

        <label for="categoria">Categoria:</label>

        <input
            type="text"
            id="categoria"
            name="categoria"
            value="{{ transacao.categoria }}"
            required
        >

        <br><br>

        <label for="data">Data:</label>

        <input
            type="date"
            id="data"
            name="data"
            value="{{ transacao.data.strftime('%Y-%m-%d') }}"
        >

        <br><br>

        <button type="submit">
            Salvar alterações
        </button>

    </form>

    <br>

    <a href="{{ url_for('dashboard')}}">Cancelar</a>

</body>

</html>
